name: CFit
options:
  bundleIdPrefix: com.chad
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  CFit:
    type: application
    platform: iOS
    sources: [CFit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chad.cfit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CFit
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  CFitTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CFitTests]
    dependencies:
      - target: CFit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  CFitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CFitUITests]
    dependencies:
      - target: CFit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CFit:
    build:
      targets:
        CFit: all
    test:
      targets: [CFitTests, CFitUITests]
